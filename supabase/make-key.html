<!doctype html><meta charset="utf-8"><title>Generate key hash</title><p>Digite uma key aleatória e copie o hash SHA-256 para o SQL.</p><input id=k size=60><button onclick="go()">Gerar</button><pre id=o></pre><script>async function go(){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.querySelector('#k').value));o.textContent=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script>
